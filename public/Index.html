  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      projectId: "gen-lang-client-0326301182",
      appId: "1:228713710959:web:d81df9cd39cf03a49c149a",
      apiKey: "AIzaSyBkFYMfgac_qNOCwHaneY9Xk6AziEMwmJo",
      authDomain: "gen-lang-client-0326301182.firebaseapp.com",
      firestoreDatabaseId: "ai-studio-remixremixremixp-5bb658ad-b79c-4c92-a6b8-fedb20dff7b0",
      storageBucket: "gen-lang-client-0326301182.firebasestorage.app",
      messagingSenderId: "228713710959"
    };

    const app = initializeApp(firebaseConfig);
    export const auth = getAuth(app);
    export const db = getFirestore(app, firebaseConfig.firestoreDatabaseId);
    
    window.signInWithGoogle = async () => {
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          email: user.email,
          displayName: user.displayName,
          role: "driver" // Default role
        }, { merge: true });
        alert("Berhasil login!");
      } catch (error) {
        console.error(error);
        alert("Gagal login: " + error.message);
      }
    };
  </script>

</head>
<body class="min-h-screen flex flex-col antialiased">

    <main id="main-content" class="flex-1 p-6 max-w-7xl mx-auto w-full">

      <div id="login-view" class="hidden max-w-md mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 p-8 space-y-6 mt-8">

        <div id="form-admin-login" class="space-y-4">

  <script>
    let appState = { drivers: [], vehicles: [], routes: [], fleetCards: [], driverExpenses: [], assignments: [], config: {} };
    let currentRole = null;
    let loggedInDriver = null;

    function getGasUrl() { return localStorage.getItem('crk_gas_url') || ''; }

    async function callGasApi(payload) {
      const url = getGasUrl();
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function updateTaskStatusExtended(id, newStatus) {
      const km = document.getElementById('km-' + id).value;
      const suhu = document.getElementById('suhu-' + id).value;
      const catatan = document.getElementById('catatan-' + id).value;
      
      const fileOdo = document.getElementById('foto-odo-' + id).files[0];
      const fileSuhu = document.getElementById('foto-suhu-' + id).files[0];

      const getBase64 = (file) => new Promise((resolve) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });

      const base64Odo = await getBase64(fileOdo);
      const base64Suhu = await getBase64(fileSuhu);

      try {
        const res = await callGasApi({ 
          action: 'updateAssignmentStatus', 
          id, 
          status: newStatus,
          km, suhu, catatan,
          fotoOdometer: base64Odo,
          fotoSuhu: base64Suhu
        });
        if (res && res.success) {
          appState = res.state;
          renderDashboard();
          alert('Status surat tugas & laporan berhasil diperbarui.');
        }
      } catch (err) { alert('Error: ' + err.message); }
    }

    async function submitDriverExpenseForm() {
      const cardId = document.getElementById('driver-expense-card').value;
      const bbm = Number(document.getElementById('driver-expense-bbm').value) || 0;
      const tol = Number(document.getElementById('driver-expense-tol').value) || 0;
      const catatan = document.getElementById('driver-expense-notes').value.trim();

      try {
        const res = await callGasApi({
          action: 'submitExpense',
          driverId: loggedInDriver.id,
          driverName: loggedInDriver.name,
          fleetCardId: cardId,
          totalPembelianBbm: bbm,
          totalPengeluaranTol: tol,
          catatan
        });
        if (res && res.success) {
          appState = res.state;
          renderDashboard();
          alert('Laporan pengeluaran berhasil dikirim.');
        }
      } catch (err) { alert('Error: ' + err.message); }
    }
    
    function openNewAssignmentModal() {
      document.getElementById('new-assignment-modal').classList.remove('hidden');
    }
    function closeNewAssignmentModal() {
      document.getElementById('new-assignment-modal').classList.add('hidden');
    }
    async function submitNewAssignment() {
      const payload = {
        action: 'createAssignment',
        noPenugasan: document.getElementById('asg-no').value,
        driverName: document.getElementById('asg-driver').value,
        plateNumber: document.getElementById('asg-plate').value,
        destination: document.getElementById('asg-dest').value
      };
      try {
        const res = await callGasApi(payload);
        if (res && res.success) {
          appState = res.state;
          renderDashboard();
          closeNewAssignmentModal();
          alert('Surat tugas berhasil diterbitkan.');
        }
      } catch (err) { alert('Gagal: ' + err.message); }
    }
